<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}メニューCSV変換ツール{% endblock %} | Smaregi対応</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <header class="bg-white border-b border-gray-200 px-4 py-3">
    <div class="max-w-4xl mx-auto flex items-center gap-2">
      <a href="/" class="text-lg font-bold text-indigo-600 hover:text-indigo-700">メニューCSV変換</a>
      <span class="text-gray-400 text-sm">Smaregi商品登録用</span>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="mb-6 space-y-2">
          {% for msg in messages %}
            <div class="bg-red-50 border border-red-200 text-red-700 rounded-lg px-4 py-3 text-sm">{{ msg }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
